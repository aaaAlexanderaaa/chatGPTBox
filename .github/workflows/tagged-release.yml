name: tagged-release
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: "write"
  contents: "write"
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - uses: actions/checkout@v5

      - name: Verify frozen release version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const expected = process.env.VERSION
            const files = ["package.json", "src/manifest.json", "src/manifest.v2.json"]
            for (const file of files) {
              const actual = JSON.parse(readFileSync(file, "utf8")).version
              if (actual !== expected) {
                console.error(file + " is " + actual + ", tag expects " + expected)
                process.exit(1)
              }
            }
            console.log("frozen version " + expected)
          '

      - name: Extract release notes from README changelog
        run: |
          awk '/^### v'"${{ env.VERSION }}"'/{found=1; next} found && /^### v/{exit} found{print}' README.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then echo "Release ${{ env.VERSION }}" > /tmp/release-notes.md; fi

      - run: |
          gh release create ${{github.ref_name}} -d -F /tmp/release-notes.md -t ${{github.ref_name}}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - run: npm run build

      - run: |
          gh release upload ${{github.ref_name}} build/chromium.zip
          gh release upload ${{github.ref_name}} build/firefox.zip
          gh release upload ${{github.ref_name}} build/chromium-without-katex-and-tiktoken.zip
          gh release upload ${{github.ref_name}} build/firefox-without-katex-and-tiktoken.zip

      - run: |
          gh release edit ${{github.ref_name}} --draft=false
