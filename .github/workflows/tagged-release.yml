name: tagged-release
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: "write"
  contents: "write"
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Update manifest.json version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: src/manifest.json
          field: version
          value: ${{ env.VERSION }}

      - name: Update manifest.v2.json version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: src/manifest.v2.json
          field: version
          value: ${{ env.VERSION }}

      - name: Push files
        continue-on-error: true
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit -am "release v${{ env.VERSION }}"
          git push

      - name: Extract release notes from README changelog
        run: |
          awk '/^### v'"${{ env.VERSION }}"'/{found=1; next} found && /^### v/{exit} found{print}' README.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then echo "Release ${{ env.VERSION }}" > /tmp/release-notes.md; fi

      - run: |
          gh release create ${{github.ref_name}} -d -F /tmp/release-notes.md -t ${{github.ref_name}}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci

      - run: npm run build

      - run: |
          gh release upload ${{github.ref_name}} build/chromium.zip
          gh release upload ${{github.ref_name}} build/firefox.zip
          gh release upload ${{github.ref_name}} build/chromium-without-katex-and-tiktoken.zip
          gh release upload ${{github.ref_name}} build/firefox-without-katex-and-tiktoken.zip

      - run: |
          gh release edit ${{github.ref_name}} --draft=false
