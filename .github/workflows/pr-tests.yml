name: pr-tests

on:
  pull_request:
    types:
      - "opened"
      - "reopened"
      - "synchronize"
    paths:
      - ".github/workflows/pr-tests.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "build.mjs"
      - "vitest.config.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  tests:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  audit:
    runs-on: ubuntu-22.04
    needs: tests
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm audit --audit-level=high
